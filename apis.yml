name: Second Nature
description: >-
  Second Nature is a UK-based digital weight-loss programme that combines
  NHS-trusted, CQC-regulated clinical care with dietitian-led coaching and
  behaviour-change support. The service pairs weight-loss medication (including
  Wegovy, Mounjaro, oral semaglutide and Orlistat programmes) with personalised
  medication reviews, a mobile app for tracking, and a science-based content
  library of guides and member stories. It operates as a registered pharmacy,
  supports NHS referrals and partnerships, and was surfaced as a portfolio
  company of 500 Global and Speedinvest. As of this enrichment pass Second
  Nature publishes a consumer marketing site and an llms.txt discovery file but
  exposes no public developer portal, API reference, SDKs, or machine-readable
  API surface.
